[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minisklearn"
version = "0.1.0"
description = "Un mini scikit-learn écrit de zéro avec Numpy, testé contre scikit-learn."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3", "matplotlib>=3.7"]

["tool.setuptools.packages.find"]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"